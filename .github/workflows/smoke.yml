name: Smoke test (no games, AddressSanitizer)

# Builds Arcadia with AddressSanitizer and runs tools/smoke_test.sh on a virtual screen: with no games, change the
# colours, collections grouping and theme; quit while a Setup tool runs; start in Kid mode. Fails on any sanitizer
# report, crash or bad exit. (Every crash Arcadia has had came from these paths.) Runs when the program changes.
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "es-app/**"
      - "es-core/**"
      - "resources/**"
      - "themes/**"
      - "CMakeLists.txt"
      - "CMake/**"
      - "tools/smoke_test.sh"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gettext git pkg-config \
            libharfbuzz-dev libicu-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev libcurl4-openssl-dev libpugixml-dev libbluetooth-dev \
            libgl1-mesa-dev libpoppler-cpp-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libudev-dev libdrm-dev \
            libgbm-dev libpulse-dev libsdl2-dev xvfb xdotool libgl1-mesa-dri

      - name: Build with AddressSanitizer
        run: |
          cmake -DASAN=on -DCMAKE_BUILD_TYPE=Debug .
          make -j"$(nproc)"

      - name: Smoke test
        run: bash tools/smoke_test.sh ./arcadia
