# Builds the Steam Deck AppImage of this fork (Arcadia with the Deck defaults) and the "deck extras" archive, and
# publishes releases the same way Deckhand does.
name: Steam Deck AppImage

# Every push to main tests and builds the AppImage (download it from the run's Artifacts). Releasing works like Deckhand's:
# bump the version in the VERSION file, write what changed in RELEASE_NOTES.md, push to main, and when there is no release
# for that version yet this publishes v<version> with the AppImage and the deck extras. It can also be run by hand from the
# Actions tab, to only build.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04   # an older system, so the AppImage runs on as many distributions as possible
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, not '$VERSION'"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the setup tools
        run: bash deck/tests/test-deck.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gettext git wget \
            libharfbuzz-dev libicu-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev libcurl4-openssl-dev libpugixml-dev libbluetooth-dev \
            libgl1-mesa-dev libpoppler-cpp-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libudev-dev libdrm-dev \
            libgbm-dev libpulse-dev libsdl2-dev

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # the AppImage tools can't use FUSE on a CI machine
        run: bash tools/create_AppImage_SteamDeck.sh

      - name: Pack the Deck extras
        run: tar -czf arcadia-deck-extras.tar.gz deck FORK.md

      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-appimage
          path: |
            Arcadia_x64_SteamDeck.AppImage
            arcadia-deck-extras.tar.gz

      - name: Already released?
        id: existing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: github.event_name == 'push' && steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Arcadia_x64_SteamDeck.AppImage arcadia-deck-extras.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Arcadia $VERSION" --notes-file RELEASE_NOTES.md
