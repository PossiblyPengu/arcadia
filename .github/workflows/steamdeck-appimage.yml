# Builds the Steam Deck AppImage of this fork (Arcadia with the Deck defaults) and the "deck extras" archive.
# Every push to main builds it (download it from the run's Artifacts in the Actions tab); you can also run it by hand
# from the Actions tab. Pushing a tag like v1.0.0 additionally publishes it as a release; so does running it by hand with
# "release_tag" filled in (GitHub then creates that tag on the commit it runs for).
name: Steam Deck AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v0.1.0); leave empty to only build"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04   # an older system, so the AppImage runs on as many distributions as possible
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gettext git wget \
            libharfbuzz-dev libicu-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev libcurl4-openssl-dev libpugixml-dev libbluetooth-dev \
            libgl1-mesa-dev libpoppler-cpp-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libudev-dev libdrm-dev \
            libgbm-dev libpulse-dev libsdl2-dev

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # the AppImage tools can't use FUSE on a CI machine
        run: bash tools/create_AppImage_SteamDeck.sh

      - name: Pack the Deck extras
        run: tar -czf arcadia-deck-extras.tar.gz deck FORK.md

      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-appimage
          path: |
            Arcadia_x64_SteamDeck.AppImage
            arcadia-deck-extras.tar.gz

      - name: Publish a release (tags, or a release_tag given by hand)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            Arcadia_x64_SteamDeck.AppImage
            arcadia-deck-extras.tar.gz
