name: CI

# Work in progress is tested on every branch but main, as Deckhand's is (main is tested and built by
# steamdeck-appimage.yml, which also releases). The setup tools' checks are quick; the AppImage is built on main.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, not '$VERSION'"; exit 1; }

      - name: Test the setup tools
        run: bash deck/tests/test-deck.sh

      # Lint reports, warnings only for now (they don't fail the run): shellcheck for the setup tools, flake8 for their
      # Python.
      - name: Lint (warnings only)
        continue-on-error: true
        run: |
          shellcheck deck/install.sh deck/tools/*.sh deck/lib/*.sh deck/scripts/*/*.sh || true
          python3 -m pip install flake8 >/dev/null
          python3 -m flake8 --max-line-length 120 deck/lib || true
